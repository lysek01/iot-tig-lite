# InfluxDB 1.8 configuration used by iot-tig-lite.
# Tuned for small devices (Raspberry Pi 3, 1 GB RAM, SD card).
# Any value can be overridden with the standard INFLUXDB_<SECTION>_<KEY> variables.

reporting-disabled = true
bind-address = "127.0.0.1:8088"

[meta]
  dir = "/var/lib/influxdb/meta"
  logging-enabled = false

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  index-version = "tsi1"
  query-log-enabled = false
  trace-logging-enabled = false
  cache-max-memory-size = "128m"
  cache-snapshot-memory-size = "8m"
  max-concurrent-compactions = 1
  series-id-set-cache-size = 20

[retention]
  enabled = true
  check-interval = "30m"

[monitor]
  # do not write InfluxDB's own statistics to the SD card
  store-enabled = false

[http]
  enabled = true
  bind-address = ":8086"
  auth-enabled = true
  log-enabled = false
  write-tracing = false
  pprof-enabled = false
  flux-enabled = false

[logging]
  level = "warn"
  suppress-logo = true

[subscriber]
  enabled = false

[continuous_queries]
  log-enabled = false
