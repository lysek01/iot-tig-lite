# Builds the image for amd64, arm64 and arm/v7, runs the end-to-end test
# and pushes it to Docker Hub.
#
# Release: push a tag like v0.3.0  ->  lysek01/iot-tig-lite:0.3.0, :0.3 and :latest
# Manual run (Actions tab -> Run workflow): build and test only, nothing is pushed.
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub user (lysek01)
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write permission

name: docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: lysek01/iot-tig-lite

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: iot-tig-lite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: End-to-end test
        run: bash test/test.sh iot-tig-lite:test

      - name: Version from the tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build all platforms (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: IOT_TIG_LITE_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
