# Mosquitto configuration – default of iot-tig-lite.
#
# This file is copied to /mosquitto/config/mosquitto.conf when that file
# does not exist. Edit it or mount your own /mosquitto/config directory;
# see https://mosquitto.org/man/mosquitto-conf-5.html
#
# Telegraf inside the container connects to 127.0.0.1:1883, so keep
# a listener on port 1883 (it may be bound to 127.0.0.1 only).

# MQTT
listener 1883

# MQTT over WebSockets
listener 9001
protocol websockets

# Anyone on the network may publish and subscribe.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
