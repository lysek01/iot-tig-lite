; Grafana configuration used by iot-tig-lite.
; Only differences from Grafana defaults are listed here.
; Any value can be overridden with the standard GF_<SECTION>_<KEY> variables.

[server]
; gzip buffers ~1 MB per CPU core and is useless on a local network
enable_gzip = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[security]
disable_gravatar = true

[log]
level = error

[feature_toggles]
; this image ships only the InfluxDB data source plugin
prometheusTypeMigration = false

[plugins]
; do not download plugins at startup (works offline, saves space)
preinstall_disabled = true

[dashboards]
default_home_dashboard_path = /usr/share/iot-tig-lite/dashboards/iot-overview.json
